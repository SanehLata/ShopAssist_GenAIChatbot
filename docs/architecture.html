<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopAssist E-commerce Chatbot Workflow</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Outfit', sans-serif;
    background: #0a0f1e;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    overflow-x: hidden;
  }

  .page-wrapper {
    width: 100%;
    max-width: 1280px;
  }

  /* Background canvas effect */
  .diagram-container {
    position: relative;
    background: linear-gradient(135deg, #0d1b3e 0%, #0a1628 40%, #0f1a35 70%, #0d1b3e 100%);
    border-radius: 24px;
    padding: 52px 60px 60px;
    box-shadow:
      0 0 0 1px rgba(99,179,255,0.08),
      0 40px 80px rgba(0,0,0,0.6),
      0 0 120px rgba(30,80,180,0.15) inset;
    overflow: hidden;
  }

  /* Subtle grid background */
  .diagram-container::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(99,179,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,179,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    border-radius: 24px;
    pointer-events: none;
  }

  /* Radial glow blobs */
  .glow-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    opacity: 0.18;
  }
  .glow-blob-1 { width: 400px; height: 400px; background: #3b82f6; top: -100px; left: -80px; }
  .glow-blob-2 { width: 300px; height: 300px; background: #10b981; bottom: 20px; right: 100px; }
  .glow-blob-3 { width: 250px; height: 250px; background: #f59e0b; top: 60%; left: 30%; }

  /* Header */
  .header {
    position: relative;
    text-align: center;
    margin-bottom: 52px;
  }
  .header-badge {
    display: inline-block;
    background: rgba(99,179,255,0.1);
    border: 1px solid rgba(99,179,255,0.2);
    color: #63b3ff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 40px;
    margin-bottom: 14px;
  }
  .header h1 {
    font-family: 'Outfit', sans-serif;
    font-size: 30px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.5px;
  }
  .header h1 span {
    background: linear-gradient(90deg, #63b3ff, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-sub {
    color: rgba(160,180,220,0.7);
    font-size: 13px;
    margin-top: 6px;
    font-weight: 400;
  }

  /* Legend */
  .legend {
    display: flex;
    justify-content: center;
    gap: 28px;
    margin-bottom: 48px;
    position: relative;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 500;
    color: rgba(200,220,255,0.75);
    letter-spacing: 0.04em;
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  /* SVG diagram */
  .svg-wrapper {
    position: relative;
    width: 100%;
    overflow: visible;
  }

  svg {
    width: 100%;
    height: auto;
    overflow: visible;
  }

  /* Node styles */
  .node-rect {
    rx: 10; ry: 10;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
    transition: all 0.2s;
  }

  /* Flow colors */
  /* Smalltalk: Blue #3b82f6 */
  /* Product: Amber #f59e0b */
  /* FAQ: Emerald #10b981 */

  .node-text {
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    font-weight: 600;
    fill: #ffffff;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
  }
  .node-text-sm {
    font-size: 10.5px;
  }

  /* Connector arrows */
  .connector {
    fill: none;
    stroke-width: 2;
    opacity: 0.7;
  }
  .connector-smalltalk { stroke: #60a5fa; }
  .connector-product   { stroke: #fbbf24; }
  .connector-faq       { stroke: #34d399; }
  .connector-shared    { stroke: #94a3b8; }

  /* Diamond decision node */
  .diamond-wrap { filter: drop-shadow(0 4px 16px rgba(200,80,200,0.35)); }

  /* Section labels */
  .flow-label {
    font-family: 'Outfit', sans-serif;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.7;
  }

  /* Animate connectors */
  @keyframes dashMove {
    from { stroke-dashoffset: 0; }
    to { stroke-dashoffset: -30; }
  }
  .animated-line {
    stroke-dasharray: 6 4;
    animation: dashMove 1.2s linear infinite;
  }

  /* Entry node glow */
  @keyframes pulse-entry {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(99,179,255,0.4)); }
    50% { filter: drop-shadow(0 0 14px rgba(99,179,255,0.8)); }
  }
  .entry-node { animation: pulse-entry 2.5s ease-in-out infinite; }

  /* Output node glow */
  @keyframes pulse-out {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(167,139,250,0.4)); }
    50% { filter: drop-shadow(0 0 18px rgba(167,139,250,0.9)); }
  }
  .output-node { animation: pulse-out 2.5s ease-in-out infinite; }

  /* Fade-in animation on load */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .diagram-container { animation: fadeUp 0.7s ease-out both; }
</style>
</head>
<body>

<div class="page-wrapper">
  <div class="diagram-container">
    <div class="glow-blob glow-blob-1"></div>
    <div class="glow-blob glow-blob-2"></div>
    <div class="glow-blob glow-blob-3"></div>

    <!-- Header -->
    <div class="header">
      <div class="header-badge">Architecture Overview</div>
      <h1>ShopAssist <span>E-commerce Chatbot</span> Workflow</h1>
      <div class="header-sub">Intelligent query routing across three specialized processing pipelines</div>
    </div>

    <!-- Legend -->
    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot" style="background:#60a5fa; box-shadow:0 0 8px #3b82f688;"></div>
        Smalltalk Flow
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#fbbf24; box-shadow:0 0 8px #f59e0b88;"></div>
        Product Query Flow
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#34d399; box-shadow:0 0 8px #10b98188;"></div>
        FAQ Flow
      </div>
    </div>

    <!-- SVG Diagram -->
    <div class="svg-wrapper">
            <svg viewBox="0 0 1110 490" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arr-shared" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
          </marker>
          <marker id="arr-smalltalk" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#60a5fa"/>
          </marker>
          <marker id="arr-product" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#fbbf24"/>
          </marker>
          <marker id="arr-faq" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#34d399"/>
          </marker>
          <linearGradient id="grad-neutral" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#152d4a"/>
          </linearGradient>
          <linearGradient id="grad-entry" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1e40af"/><stop offset="100%" stop-color="#1d3799"/>
          </linearGradient>
          <linearGradient id="grad-router" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#312e81"/><stop offset="100%" stop-color="#1e1b4b"/>
          </linearGradient>
          <linearGradient id="grad-smalltalk" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1d4ed8"/><stop offset="100%" stop-color="#1e3a8a"/>
          </linearGradient>
          <linearGradient id="grad-product" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#b45309"/><stop offset="100%" stop-color="#92400e"/>
          </linearGradient>
          <linearGradient id="grad-faq" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#065f46"/><stop offset="100%" stop-color="#064e3b"/>
          </linearGradient>
          <linearGradient id="grad-llm-st" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1d4ed8"/><stop offset="100%" stop-color="#1e3a8a"/>
          </linearGradient>
          <linearGradient id="grad-llm-pr" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#b45309"/><stop offset="100%" stop-color="#92400e"/>
          </linearGradient>
          <linearGradient id="grad-llm-fq" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#065f46"/><stop offset="100%" stop-color="#064e3b"/>
          </linearGradient>
          <linearGradient id="grad-sqlite" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#5b21b6"/>
          </linearGradient>
          <linearGradient id="grad-output" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6d28d9"/><stop offset="100%" stop-color="#4c1d95"/>
          </linearGradient>
          <linearGradient id="grad-diamond" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#db2777"/><stop offset="100%" stop-color="#9d174d"/>
          </linearGradient>
          <filter id="glow-blue" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="glow-amber" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="shadow-node">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
          </filter>
        </defs>

        <!--
          LAYOUT (viewBox 0 0 1110 490):
          ┌──────────────────┬────────────────────────────────────────────────────────────┐
          │  INPUT & ROUTING │  SMALLTALK lane  y=42..142                                │
          │  x=10..315       │  PRODUCT   lane  y=172..322                               │
          │  nodes centred   │  FAQ       lane  y=352..442                               │
          │  at y=232        └────────────────────────────────────────────────────────────┘
          └──────────────────┘
          Node x positions (right zone, lanes start x=320):
            Lane label badge: x=324 (left edge of band)
            First flow node:  x=420
          Product flow (5 nodes, spacing ~112):
            Product Query x=420, LLM1 x=534, SQL Query x=648, SQLite x=762, LLM2 x=876
            Generate Answer x=990 (shared output)
        -->

        <!-- ══════════════════════════════════════════════════════════════ -->
        <!-- NEUTRAL PRE-ROUTING ZONE                                       -->
        <!-- ══════════════════════════════════════════════════════════════ -->
        <rect x="10" y="28" width="308" height="434" rx="14"
              fill="rgba(255,255,255,0.02)" stroke="rgba(148,163,184,0.1)" stroke-width="1"
              stroke-dasharray="6 4"/>
        <text x="164" y="20" text-anchor="middle" font-family="Outfit" font-size="9"
              font-weight="600" letter-spacing="0.12em" text-transform="uppercase"
              fill="rgba(148,163,184,0.45)">INPUT &amp; ROUTING</text>

        <!-- ══════════════════════════════════════════════════════════════ -->
        <!-- FLOW LANE BACKGROUNDS (x=320 onward)                          -->
        <!-- ══════════════════════════════════════════════════════════════ -->
        <!-- Smalltalk lane: y=42..142, height=100 -->
        <rect x="320" y="42" width="778" height="100" rx="12"
              fill="rgba(59,130,246,0.07)" stroke="rgba(96,165,250,0.18)" stroke-width="1"/>
        <!-- Product lane: y=172..322, height=150 -->
        <rect x="320" y="172" width="778" height="150" rx="12"
              fill="rgba(245,158,11,0.07)" stroke="rgba(251,191,36,0.18)" stroke-width="1"/>
        <!-- FAQ lane: y=352..442, height=100 -->
        <rect x="320" y="352" width="778" height="100" rx="12"
              fill="rgba(16,185,129,0.07)" stroke="rgba(52,211,153,0.18)" stroke-width="1"/>

        <!-- ── LANE LABELS: positioned at bottom-inside of each band, away from nodes ── -->
        <text x="1090" y="135" text-anchor="end" font-family="Outfit" font-size="9.5"
              font-weight="600" letter-spacing="0.12em" fill="#60a5fa" opacity="0.6">SMALLTALK</text>
        <text x="1090" y="315" text-anchor="end" font-family="Outfit" font-size="9.5"
              font-weight="600" letter-spacing="0.12em" fill="#fbbf24" opacity="0.6">PRODUCT</text>
        <text x="1090" y="443" text-anchor="end" font-family="Outfit" font-size="9.5"
              font-weight="600" letter-spacing="0.12em" fill="#34d399" opacity="0.6">FAQ</text>

        <!-- ══════════════════════════════════════════════════════════════ -->
        <!-- CONNECTORS                                                     -->
        <!-- ══════════════════════════════════════════════════════════════ -->

        <!-- User Query → Semantic Router -->
        <line x1="108" y1="232" x2="148" y2="232"
              class="connector connector-shared" marker-end="url(#arr-shared)"/>
        <!-- Semantic Router → Determine Route -->
        <line x1="228" y1="232" x2="264" y2="232"
              class="connector connector-shared" marker-end="url(#arr-shared)"/>

        <!-- Determine Route → Smalltalk (up-right) -->
        <path d="M 288 212 L 288 92 L 418 92"
              class="connector connector-smalltalk animated-line" marker-end="url(#arr-smalltalk)"/>
        <text x="294" y="152" font-family="Outfit" font-size="8.5" font-weight="600"
              letter-spacing="0.1em" fill="#60a5fa" opacity="0.7">SMALLTALK</text>

        <!-- Determine Route → Product (straight) -->
        <line x1="312" y1="232" x2="418" y2="232"
              class="connector connector-product animated-line" marker-end="url(#arr-product)"/>
        <text x="316" y="226" font-family="Outfit" font-size="8.5" font-weight="600"
              letter-spacing="0.1em" fill="#fbbf24" opacity="0.7">PRODUCT</text>

        <!-- Determine Route → FAQ (down-right) -->
        <path d="M 288 252 L 288 392 L 418 392"
              class="connector connector-faq animated-line" marker-end="url(#arr-faq)"/>
        <text x="294" y="324" font-family="Outfit" font-size="8.5" font-weight="600"
              letter-spacing="0.1em" fill="#34d399" opacity="0.7">FAQ</text>

        <!-- ── SMALLTALK: Smalltalk → LLM → (merge right → down to output) ── -->
        <line x1="498" y1="92" x2="548" y2="92"
              class="connector connector-smalltalk" marker-end="url(#arr-smalltalk)"/>
        <path d="M 618 92 L 1032 92 L 1032 208"
              class="connector connector-smalltalk" marker-end="url(#arr-smalltalk)"/>

        <!-- ── PRODUCT: Product Query → LLM → SQL Query → SQLite → LLM → Generate Answer ── -->
        <line x1="498" y1="247" x2="532" y2="247"
              class="connector connector-product" marker-end="url(#arr-product)"/>
        <line x1="602" y1="247" x2="646" y2="247"
              class="connector connector-product" marker-end="url(#arr-product)"/>
        <line x1="716" y1="247" x2="760" y2="247"
              class="connector connector-product" marker-end="url(#arr-product)"/>
        <line x1="850" y1="247" x2="874" y2="247"
              class="connector connector-product" marker-end="url(#arr-product)"/>
        <line x1="944" y1="247" x2="988" y2="247"
              class="connector connector-product" marker-end="url(#arr-product)"/>

        <!-- ── FAQ: FAQ → FAQ/CSV → LLM → (merge right → up to output) ── -->
        <line x1="498" y1="392" x2="548" y2="392"
              class="connector connector-faq" marker-end="url(#arr-faq)"/>
        <line x1="668" y1="392" x2="712" y2="392"
              class="connector connector-faq" marker-end="url(#arr-faq)"/>
        <path d="M 782 392 L 1032 392 L 1032 272"
              class="connector connector-faq" marker-end="url(#arr-faq)"/>

        <!-- ══════════════════════════════════════════════════════════════ -->
        <!-- NODES                                                          -->
        <!-- ══════════════════════════════════════════════════════════════ -->

        <!-- USER QUERY -->
        <g class="entry-node" filter="url(#glow-blue)">
          <rect x="26" y="207" width="82" height="50" rx="10" fill="url(#grad-entry)" stroke="#60a5fa" stroke-width="1.5"/>
          <text x="67" y="228" class="node-text node-text-sm">User</text>
          <text x="67" y="244" class="node-text node-text-sm">Query</text>
        </g>

        <!-- SEMANTIC ROUTER -->
        <g filter="url(#shadow-node)">
          <rect x="148" y="207" width="80" height="50" rx="10" fill="url(#grad-router)" stroke="#a78bfa" stroke-width="1.5"/>
          <text x="188" y="228" class="node-text node-text-sm">Semantic</text>
          <text x="188" y="244" class="node-text node-text-sm">Router</text>
        </g>

        <!-- DETERMINE ROUTE (diamond) -->
        <g class="diamond-wrap">
          <polygon points="288,207 314,232 288,257 262,232"
                   fill="url(#grad-diamond)" stroke="#f472b6" stroke-width="1.5"/>
          <text x="288" y="228" class="node-text" style="font-size:9px;">Determine</text>
          <text x="288" y="240" class="node-text" style="font-size:9px;">Route</text>
        </g>

        <!-- ── SMALLTALK NODES ── -->
        <!-- Smalltalk: x=418, centre y=92 -->
        <g filter="url(#glow-blue)">
          <rect x="418" y="67" width="80" height="50" rx="10" fill="url(#grad-smalltalk)" stroke="#60a5fa" stroke-width="1.5"/>
          <text x="458" y="95" class="node-text">Smalltalk</text>
        </g>
        <!-- LLM: x=548 -->
        <g filter="url(#glow-blue)">
          <rect x="548" y="67" width="70" height="50" rx="10" fill="url(#grad-llm-st)" stroke="#60a5fa" stroke-width="1.5"/>
          <text x="583" y="95" class="node-text">LLM</text>
        </g>

        <!-- ── PRODUCT NODES (5 nodes) ── centre y=247 -->
        <!-- 1. Product Query: x=418 -->
        <g filter="url(#glow-amber)">
          <rect x="418" y="222" width="80" height="50" rx="10" fill="url(#grad-product)" stroke="#fbbf24" stroke-width="1.5"/>
          <text x="458" y="243" class="node-text node-text-sm">Product</text>
          <text x="458" y="259" class="node-text node-text-sm">Query</text>
        </g>
        <!-- 2. LLM: x=532 -->
        <g filter="url(#glow-amber)">
          <rect x="532" y="222" width="70" height="50" rx="10" fill="url(#grad-llm-pr)" stroke="#fbbf24" stroke-width="1.5"/>
          <text x="567" y="250" class="node-text">LLM</text>
        </g>
        <!-- 3. SQL Query: x=646 -->
        <g filter="url(#glow-amber)">
          <rect x="646" y="222" width="70" height="50" rx="10" fill="url(#grad-product)" stroke="#fbbf24" stroke-width="1.5"/>
          <text x="681" y="243" class="node-text node-text-sm">SQL</text>
          <text x="681" y="259" class="node-text node-text-sm">Query</text>
        </g>
        <!-- 4. SQLite Database: x=760 -->
        <g filter="url(#glow-amber)">
          <rect x="760" y="222" width="90" height="50" rx="10" fill="url(#grad-sqlite)" stroke="#a78bfa" stroke-width="1.5"/>
          <text x="805" y="243" class="node-text node-text-sm">SQLite</text>
          <text x="805" y="259" class="node-text node-text-sm">Database</text>
        </g>
        <!-- 5. LLM: x=874 -->
        <g filter="url(#glow-amber)">
          <rect x="874" y="222" width="70" height="50" rx="10" fill="url(#grad-llm-pr)" stroke="#fbbf24" stroke-width="1.5"/>
          <text x="909" y="250" class="node-text">LLM</text>
        </g>

        <!-- ── FAQ NODES ── centre y=392 -->
        <!-- FAQ: x=418 -->
        <g filter="url(#glow-green)">
          <rect x="418" y="367" width="80" height="50" rx="10" fill="url(#grad-faq)" stroke="#34d399" stroke-width="1.5"/>
          <text x="458" y="395" class="node-text">FAQ</text>
        </g>
        <!-- FAQ/CSV Database: x=548 -->
        <g filter="url(#glow-green)">
          <rect x="548" y="367" width="120" height="50" rx="10" fill="url(#grad-faq)" stroke="#34d399" stroke-width="1.5"/>
          <text x="608" y="387" class="node-text node-text-sm">FAQ/CSV</text>
          <text x="608" y="403" class="node-text node-text-sm">Database</text>
        </g>
        <!-- LLM: x=712 -->
        <g filter="url(#glow-green)">
          <rect x="712" y="367" width="70" height="50" rx="10" fill="url(#grad-llm-fq)" stroke="#34d399" stroke-width="1.5"/>
          <text x="747" y="395" class="node-text">LLM</text>
        </g>
